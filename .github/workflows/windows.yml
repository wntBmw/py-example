name: Run Python on Windows

on:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile 
        run: python -m compileall .

      - name: Run script
        run: python main.py
